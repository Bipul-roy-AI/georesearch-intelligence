name: Publish Field Atlas

on:
  push:
    paths:
      - src/**
      - scripts/build.cjs
      - scripts/check.cjs
      - index.html
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: field-atlas-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and test the dashboard
        run: |
          node scripts/build.cjs
          node scripts/check.cjs
      - name: Update the website branch
        run: |
          git fetch --no-tags origin refs/heads/gh-pages:refs/remotes/origin/gh-pages
          site="$RUNNER_TEMP/field-atlas-public"
          git worktree add --detach "$site" origin/gh-pages
          cp index.html "$site/index.html"
          touch "$site/.nojekyll"
          git -C "$site" add -- index.html .nojekyll
          if ! git -C "$site" diff --cached --quiet; then
            git -C "$site" -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Publish Field Atlas dashboard'
            git -C "$site" push origin HEAD:refs/heads/gh-pages
          fi
      - name: Request a Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent
